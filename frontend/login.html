<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Digital Scam Shield</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
            color: white;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e2e8f0;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #loginMessage {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #93c5fd;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: white;
        }

        .security-note {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 526px) {

            .login-card {
                padding: 30px 22px;
            }

            h2 {
                font-size: 24px;
            }

            .logo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🛡️ AI Digital Scam Shield
            </div>

            <p class="subtitle">
                Smart protection against digital scams
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>

                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton">

                    Login

                </button>

            </form>

            <p id="loginMessage"></p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

            <div class="security-note">
                🔐 Your security matters. Stay alert and protect your information.
            </div>

        </div>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");

        const loginMessage = document.getElementById("loginMessage");

        const loginButton = document.getElementById("loginButton");


        loginForm.addEventListener("submit", async function (event) {

            event.preventDefault();


            const email = document.getElementById("email").value.trim();

            const password = document.getElementById("password").value;


            loginMessage.textContent = "Logging in...";
            sessionStorage.setItem("loggedIn", "true");

            loginMessage.style.color = "#93c5fd";

            loginButton.disabled = true;

            loginButton.textContent = "Logging in...";


            try {

                const response = await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    // Save JWT token
                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    // Save logged-in user email
                    localStorage.setItem(
                        "userEmail",
                        email
                    );


                    loginMessage.textContent =
                        "Login successful!";

                    loginMessage.style.color =
                        "#4ade80";


                    loginButton.textContent =
                        "Success ✓";


                    setTimeout(function () {

                        window.location.href =
                            "index.html";

                    }, 1000);


                } else {

                    loginMessage.textContent =
                        data.error || "Invalid email or password.";

                    loginMessage.style.color =
                        "#f87171";


                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Login";
                }


            } catch (error) {

                console.error(error);


                loginMessage.textContent =
                    "Unable to connect to server.";

                loginMessage.style.color =
                    "#f87171";


                loginButton.disabled = false;

                loginButton.textContent =
                    "Login";
            }

        });

    </script>

</body>

</html>
