<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Digital Scam Shield</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f172a, #111827, #1e293b);
            color: white;
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 420px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #e2e8f0;
        }

        input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #60a5fa;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        #registerMessage {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #93c5fd;
            text-decoration: none;
            font-size: 14px;
        }

        .login-link:hover {
            color: white;
        }

        .security-note {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 526px) {

            .register-card {
                padding: 30px 22px;
            }

            h2 {
                font-size: 24px;
            }

            .logo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <div class="register-card">

            <div class="logo">
                🛡️ AI Digital Scam Shield
            </div>

            <p class="subtitle">
                Create your secure account
            </p>

            <h2>Register</h2>

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required>

                </div>


                <button
                    type="submit"
                    class="register-btn"
                    id="registerButton">

                    Create Account

                </button>

            </form>


            <p id="registerMessage"></p>


            <a href="login.html" class="login-link">
                Already have an account? Login
            </a>


            <div class="security-note">
                🔐 Your password is securely protected.
            </div>

        </div>

    </div>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const registerMessage =
            document.getElementById("registerMessage");

        const registerButton =
            document.getElementById("registerButton");


        registerForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const name =
                    document.getElementById("name").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const password =
                    document.getElementById("password").value;


                registerMessage.textContent =
                    "Creating account...";

                registerMessage.style.color =
                    "#93c5fd";

                registerButton.disabled = true;

                registerButton.textContent =
                    "Creating Account...";


                try {

                    const response = await fetch(
                        "/api/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type": "application/json"
                            },

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (response.ok) {

                        registerMessage.textContent =
                            "Account created successfully!";

                        registerMessage.style.color =
                            "#4ade80";

                        registerButton.textContent =
                            "Success ✓";


                        setTimeout(function () {

                            window.location.href =
                                "login.html";

                        }, 1200);


                    } else {

                        registerMessage.textContent =
                            data.error ||
                            "Registration failed.";

                        registerMessage.style.color =
                            "#f87171";

                        registerButton.disabled = false;

                        registerButton.textContent =
                            "Create Account";
                    }


                } catch (error) {

                    console.error(error);

                    registerMessage.textContent =
                        "Unable to connect to server.";

                    registerMessage.style.color =
                        "#f87171";

                    registerButton.disabled = false;

                    registerButton.textContent =
                        "Create Account";
                }

            }
        );

    </script>

</body>

</html>
